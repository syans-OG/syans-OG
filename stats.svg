<svg width="1180" height="320" viewBox="0 0 1180 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots-stats" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#94a3b8" opacity="0.25" />
    </pattern>
  </defs>

  <style>
    :root { color-scheme: light dark; }

    /* Light Mode (Seamless GitHub #ffffff Canvas + Brand #F2F0EB Bento Cards + #D76F55 Accent) */
    .bg { fill: #ffffff; }
    .card { fill: #F2F0EB; stroke: #D8D3C8; stroke-width: 1; }
    .title { font-family: system-ui, -apple-system, sans-serif; fill: #181614; font-weight: 800; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; fill: #78716C; font-weight: 700; }
    .stat-value { font-family: system-ui, -apple-system, sans-serif; fill: #181614; font-weight: 800; }
    .stat-label { font-family: system-ui, -apple-system, sans-serif; fill: #78716C; font-weight: 500; }
    .lang-name { font-family: system-ui, -apple-system, sans-serif; fill: #181614; font-weight: 700; }
    .lang-percent { font-family: system-ui, -apple-system, sans-serif; fill: #78716C; font-weight: 600; }
    .dot-accent { fill: #D76F55; }
    .icon-accent { fill: #D76F55; }
    .stat-box { fill: #E8E4DB; stroke: #D8D3C8; stroke-width: 1; }
    .bar-bg { fill: #E8E4DB; }
    .bar-fill-primary { fill: #D76F55; }
    .bar-fill-secondary { fill: #181614; }
    .bar-fill-tertiary { fill: #78716C; }

    /* Dark Mode (Seamless GitHub #0d1117 Canvas + Brand #181614 Bento Cards + #D76F55 Accent) */
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #181614; stroke: #38342E; }
      .title { fill: #F2F0EB; }
      .subtitle { fill: #A8A29E; }
      .stat-value { fill: #F2F0EB; }
      .stat-label { fill: #A8A29E; }
      .lang-name { fill: #F2F0EB; }
      .lang-percent { fill: #A8A29E; }
      .dot-accent { fill: #D76F55; }
      .icon-accent { fill: #D76F55; }
      .stat-box { fill: #22201D; stroke: #38342E; }
      .bar-bg { fill: #2A2723; }
      .bar-fill-primary { fill: #D76F55; }
      .bar-fill-secondary { fill: #F2F0EB; }
      .bar-fill-tertiary { fill: #A8A29E; }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1180" height="320" class="bg" />
  <rect width="1180" height="320" fill="url(#dots-stats)" />

  <!-- Section Header -->
  <circle cx="46" cy="38" r="4" class="dot-accent" />
  <text x="60" y="42" class="subtitle" font-size="12" letter-spacing="3">03 — STATS &amp; LANGUAGES</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- CARD 1: GitHub Overview & Stats (Left)     -->
  <!-- ═══════════════════════════════════════════ -->
  <g transform="translate(40, 65)">
    <rect width="535" height="215" rx="24" class="card" />

    <text x="30" y="40" class="subtitle" font-size="11" letter-spacing="2">DEVELOPMENT METRICS</text>
    <text x="30" y="66" class="title" font-size="22">GitHub Overview</text>

    <!-- Stat Grid (2x2) -->
    <!-- Stat 1: Commits -->
    <g transform="translate(30, 88)">
      <rect width="225" height="48" rx="14" class="stat-box" />
      <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z M12 6v6l4 2" class="icon-accent" transform="translate(14, 14) scale(0.8)" />
      <text x="44" y="26" class="stat-value" font-size="16">100+</text>
      <text x="44" y="40" class="stat-label" font-size="11">Total Commits</text>
    </g>

    <!-- Stat 2: Repositories -->
    <g transform="translate(270, 88)">
      <rect width="225" height="48" rx="14" class="stat-box" />
      <path d="M4 2h16a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm2 4v12h12V6H6z" class="icon-accent" transform="translate(14, 14) scale(0.8)" />
      <text x="44" y="26" class="stat-value" font-size="16">12</text>
      <text x="44" y="40" class="stat-label" font-size="11">Repositories</text>
    </g>

    <!-- Stat 3: Commit Rank -->
    <g transform="translate(30, 146)">
      <rect width="225" height="48" rx="14" class="stat-box" />
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" class="icon-accent" transform="translate(14, 14) scale(0.7)" />
      <text x="44" y="26" class="stat-value" font-size="16">A Grade</text>
      <text x="44" y="40" class="stat-label" font-size="11">Code Consistency</text>
    </g>

    <!-- Stat 4: Contributions -->
    <g transform="translate(270, 146)">
      <rect width="225" height="48" rx="14" class="stat-box" />
      <path d="M13.5 2c0 3.3-2.7 6-6 6a6 6 0 0 1-2.5-.55C3 9.4 2 11.5 2 14a10 10 0 0 0 20 0c0-6-4.5-10.5-8.5-12z" class="icon-accent" transform="translate(14, 14) scale(0.8)" />
      <text x="44" y="26" class="stat-value" font-size="16">Active</text>
      <text x="44" y="40" class="stat-label" font-size="11">Contribution Status</text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════ -->
  <!-- CARD 2: Top Languages (Right)              -->
  <!-- ═══════════════════════════════════════════ -->
  <g transform="translate(605, 65)">
    <rect width="535" height="215" rx="24" class="card" />

    <text x="30" y="40" class="subtitle" font-size="11" letter-spacing="2">STACK DISTRIBUTION</text>
    <text x="30" y="66" class="title" font-size="22">Top Languages</text>

    <!-- Language 1: JavaScript & TypeScript -->
    <g transform="translate(30, 88)">
      <text x="0" y="14" class="lang-name" font-size="14">JavaScript &amp; TypeScript</text>
      <text x="475" y="14" class="lang-percent" font-size="13" text-anchor="end">60%</text>
      <rect x="0" y="22" width="475" height="8" rx="4" class="bar-bg" />
      <rect x="0" y="22" width="285" height="8" rx="4" class="bar-fill-primary" />
    </g>

    <!-- Language 2: HTML & CSS -->
    <g transform="translate(30, 126)">
      <text x="0" y="14" class="lang-name" font-size="14">HTML, CSS &amp; Web Design</text>
      <text x="475" y="14" class="lang-percent" font-size="13" text-anchor="end">25%</text>
      <rect x="0" y="22" width="475" height="8" rx="4" class="bar-bg" />
      <rect x="0" y="22" width="119" height="8" rx="4" class="bar-fill-secondary" />
    </g>

    <!-- Language 3: Dart & Flutter -->
    <g transform="translate(30, 164)">
      <text x="0" y="14" class="lang-name" font-size="14">Dart &amp; Flutter</text>
      <text x="475" y="14" class="lang-percent" font-size="13" text-anchor="end">15%</text>
      <rect x="0" y="22" width="475" height="8" rx="4" class="bar-bg" />
      <rect x="0" y="22" width="71" height="8" rx="4" class="bar-fill-tertiary" />
    </g>
  </g>
</svg>