<svg width="375" height="75" viewBox="0 0 375 75" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots-github" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#94a3b8" opacity="0.2" />
    </pattern>
  </defs>

  <style>
    :root { color-scheme: light dark; }

    /* Light Mode */
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; transition: all 0.2s ease; }
    .icon { fill: #0f172a; }
    .label { font-family: system-ui, -apple-system, sans-serif; fill: #0f172a; font-weight: 700; font-size: 15px; }
    .handle { font-family: system-ui, -apple-system, sans-serif; fill: #64748b; font-weight: 500; font-size: 12px; }
    .arrow { fill: #64748b; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }

    /* Dark Mode */
    @media (prefers-color-scheme: dark) {
      .card { fill: #0a0a0a; stroke: #27272a; }
      .icon { fill: #f8fafc; }
      .label { fill: #f8fafc; }
      .handle { fill: #a1a1aa; }
      .arrow { fill: #a1a1aa; }
    }
  </style>

  <!-- Bento Card Base -->
  <rect width="375" height="75" rx="18" class="card" />
  <rect width="375" height="75" rx="18" fill="url(#dots-github)" />

  <!-- Content Group -->
  <g transform="translate(24, 22)">
    <!-- Icon -->
    <g transform="translate(0, 2)">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" class="icon" />
    </g>

    <!-- Text Info -->
    <text x="42" y="14" class="label">GitHub</text>
    <text x="42" y="32" class="handle">@syans-OG</text>

    <!-- Top Right Arrow Indicator -->
    <text x="311" y="20" class="arrow">&#x2197;</text>
  </g>
</svg>