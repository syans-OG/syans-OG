<svg width="1180" height="400" viewBox="0 0 1180 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#94a3b8" opacity="0.25" />
    </pattern>
  </defs>

  <style>
    :root { color-scheme: light dark; }

    /* Light Mode (Seamless GitHub #ffffff Canvas + Brand #F2F0EB Bento Cards + #D76F55 Terracotta Accent) */
    .bg { fill: #ffffff; }
    .card { fill: #F2F0EB; stroke: #D8D3C8; stroke-width: 1; }
    .title { font-family: system-ui, -apple-system, sans-serif; fill: #181614; font-weight: 800; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; fill: #78716C; font-weight: 700; }
    .body { font-family: system-ui, -apple-system, sans-serif; fill: #78716C; font-weight: 500; }
    .quote { font-family: system-ui, -apple-system, sans-serif; fill: #181614; font-weight: 600; }
    .pill { fill: #D76F55; }
    .pill-text { fill: #ffffff; font-family: system-ui, sans-serif; }
    .dot-accent { fill: #D76F55; }
    .ring { stroke: #D8D3C8; }

    /* Dark Mode (Seamless GitHub #0d1117 Canvas + Brand #181614 Bento Cards + #D76F55 Terracotta Accent) */
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #181614; stroke: #38342E; }
      .title { fill: #F2F0EB; }
      .subtitle { fill: #A8A29E; }
      .body { fill: #A8A29E; }
      .quote { fill: #F2F0EB; }
      .pill { fill: #D76F55; }
      .pill-text { fill: #ffffff; }
      .dot-accent { fill: #D76F55; }
      .ring { stroke: #38342E; }
    }

    @keyframes beacon-pulse {
      0% { r: 5px; opacity: 0.9; }
      50% { r: 12px; opacity: 0; }
      100% { r: 5px; opacity: 0; }
    }
    @keyframes spin-cw { 100% { transform: rotate(360deg); } }
    @keyframes spin-ccw { 100% { transform: rotate(-360deg); } }
    @keyframes float-badge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .pulse-ring { animation: beacon-pulse 2.2s ease-out infinite; transform-origin: 86px 78px; }
    .spinning-cw { animation: spin-cw 20s linear infinite; transform-origin: 0px 0px; }
    .spinning-ccw { animation: spin-ccw 14s linear infinite; transform-origin: 0px 0px; }
    .badge-float { animation: float-badge 3.5s ease-in-out infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1180" height="400" class="bg" />

  <!-- Dot Grid Texture -->
  <rect width="1180" height="400" fill="url(#dots)" />

  <!-- ═══════════════════════════════════════════ -->
  <!-- BENTO BOX 1 — Hero / Main Intro (left)     -->
  <!-- ═══════════════════════════════════════════ -->
  <g>
    <rect x="40" y="40" width="680" height="320" rx="28" class="card" />

    <!-- Status dot + beacon pulse + label -->
    <circle cx="86" cy="78" r="5" fill="#D76F55" class="pulse-ring" />
    <circle cx="86" cy="78" r="5" class="dot-accent" />
    <text x="105" y="82" class="subtitle" font-size="12" letter-spacing="3">SYANS CREATIVE SPACE</text>

    <!-- Main typography cascade -->
    <text x="75" y="160" class="title" font-size="52" letter-spacing="-2">SYANS® DEVELOPER</text>
    <text x="75" y="218" class="title" font-size="52" letter-spacing="-2" opacity="0.35">THINKING BEYOND</text>
    <text x="75" y="276" class="title" font-size="52" letter-spacing="-2" opacity="0.12">PIXELS.</text>

    <!-- Description -->
    <text x="80" y="315" class="body" font-size="14">A creative developer building digital experiences</text>
    <text x="80" y="338" class="body" font-size="14">that blend emotion with function.</text>

    <!-- Pill badge with float micro-animation -->
    <g class="badge-float">
      <rect x="530" y="300" width="150" height="34" rx="17" class="pill" />
      <text x="605" y="322" class="pill-text" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">UI / UX &amp; DEV</text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════ -->
  <!-- BENTO BOX 2 — Identity (right-top)         -->
  <!-- ═══════════════════════════════════════════ -->
  <g>
    <rect x="740" y="40" width="400" height="150" rx="28" class="card" />

    <text x="780" y="82" class="subtitle" font-size="12" letter-spacing="3">IDENTITY</text>

    <text x="780" y="125" class="quote" font-size="22" letter-spacing="-0.5">Syakib • 18 y.o</text>
    <text x="780" y="155" class="body" font-size="14">ID, Indonesia</text>

    <!-- Dual Counter-Rotating geometric accent -->
    <g transform="translate(1068, 85)">
      <circle cx="0" cy="0" r="30" fill="none" class="ring spinning-cw" stroke-width="1.5" stroke-dasharray="4 8" />
      <circle cx="0" cy="0" r="14" fill="none" class="ring spinning-ccw" stroke-width="1.2" stroke-dasharray="2 6" />
      <circle cx="0" cy="0" r="4" class="dot-accent" />
    </g>
  </g>

  <!-- ═══════════════════════════════════════════ -->
  <!-- BENTO BOX 3 — The Mantra (right-bottom)    -->
  <!-- ═══════════════════════════════════════════ -->
  <g>
    <rect x="740" y="210" width="400" height="150" rx="28" class="card" />

    <!-- Large decorative quote mark -->
    <text x="760" y="310" class="title" font-size="120" opacity="0.06">“</text>

    <!-- Quote text -->
    <text x="790" y="278" class="quote" font-size="22" letter-spacing="-0.5">Code is just a tool.</text>
    <text x="790" y="310" class="quote" font-size="22" letter-spacing="-0.5">The goal is to feel.</text>
  </g>

</svg>