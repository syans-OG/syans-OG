<svg width="375" height="75" viewBox="0 0 375 75" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots-linkedin" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#94a3b8" opacity="0.2" />
    </pattern>
  </defs>

  <style>
    :root { color-scheme: light dark; }

    /* Light Mode (Brand #F2F0EB Card + #D76F55 Accent) */
    .card { fill: #F2F0EB; stroke: #D8D3C8; stroke-width: 1; transition: all 0.2s ease; }
    .icon { fill: #181614; }
    .label { font-family: system-ui, -apple-system, sans-serif; fill: #181614; font-weight: 700; font-size: 15px; }
    .handle { font-family: system-ui, -apple-system, sans-serif; fill: #78716C; font-weight: 500; font-size: 12px; }
    .arrow { fill: #D76F55; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }

    /* Dark Mode (Brand #181614 Card + #D76F55 Accent) */
    @media (prefers-color-scheme: dark) {
      .card { fill: #181614; stroke: #38342E; }
      .icon { fill: #F2F0EB; }
      .label { fill: #F2F0EB; }
      .handle { fill: #A8A29E; }
      .arrow { fill: #D76F55; }
    }
  </style>

  <!-- Bento Card Base -->
  <rect width="375" height="75" rx="18" class="card" />
  <rect width="375" height="75" rx="18" fill="url(#dots-linkedin)" />

  <!-- Content Group -->
  <g transform="translate(24, 22)">
    <!-- Icon -->
    <g transform="translate(0, 2)">
      <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z" class="icon" />
    </g>

    <!-- Text Info -->
    <text x="42" y="14" class="label">LinkedIn</text>
    <text x="42" y="32" class="handle">in/syakib</text>

    <!-- Top Right Arrow Indicator -->
    <text x="311" y="20" class="arrow">&#x2197;</text>
  </g>
</svg>