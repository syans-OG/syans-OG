<svg width="1180" height="230" viewBox="0 0 1180 230" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: monospace; font-size: 14px; font-weight: bold; fill: #38BDF8; }
    .cmd { font-family: monospace; font-size: 14px; fill: #475569; }
    .card-bg { fill: #0B1120; stroke: #1E293B; stroke-width: 1.5; rx: 10; }
    .repo-name { font-family: monospace; font-size: 11px; fill: #64748B; }
    .project-name { font-family: monospace; font-size: 18px; font-weight: bold; fill: #F8FAFC; }
    .desc { font-family: sans-serif; font-size: 11px; fill: #94A3B8; }
    .badge { fill: #1E1B4B; stroke: #312E81; stroke-width: 1; rx: 10; }
    .badge-text { font-family: monospace; font-size: 11px; fill: #A78BFA; }
    .stat { font-family: monospace; font-size: 11px; fill: #64748B; }
    .circle-bg { fill: none; stroke: #1E293B; stroke-width: 8; }
    .circle-text { font-family: monospace; font-size: 13px; font-weight: bold; fill: #F8FAFC; text-anchor: middle; dominant-baseline: middle; }
    .lang-text { font-family: monospace; font-size: 11px; fill: #94A3B8; }
    .card:hover .card-bg { stroke: #38BDF8; cursor: pointer; }
  </style>

  <text x="20" y="30" class="title">PROJECTS.LIST</text>
  <text x="150" y="30" class="cmd">./projects.sh --all</text>

  <!-- Card 1: Laris.in -->
  <a href="https://github.com/syans-OG/Laris.in" target="_blank" class="card">
    <g transform="translate(20, 60)">
      <rect width="560" height="150" class="card-bg" />
      <circle cx="20" cy="20" r="3" fill="#38BDF8" />
      <text x="28" y="24" class="repo-name">syans-OG/Laris.in</text>
      <circle cx="540" cy="20" r="3" fill="#334155" />

      <rect x="20" y="42" width="40" height="40" fill="#10B981" rx="8" />
      <text x="40" y="68" font-family="monospace" font-size="22" fill="#0A101F" text-anchor="middle" font-weight="bold">L</text>

      <text x="75" y="57" class="project-name">Laris.in_</text>
      <text x="75" y="75" class="desc">Seamless POS System for modern cashiers</text>

      <rect x="20" y="95" width="64" height="20" class="badge" />
      <text x="52" y="109" class="badge-text" text-anchor="middle">Flutter</text>
      <rect x="92" y="95" width="46" height="20" class="badge" />
      <text x="115" y="109" class="badge-text" text-anchor="middle">Dart</text>
      <rect x="146" y="95" width="60" height="20" class="badge" />
      <text x="176" y="109" class="badge-text" text-anchor="middle">SQLite</text>

      <text x="20" y="135" class="stat">★ 3   updated recently</text>

      <circle cx="355" cy="57" r="3" fill="#A78BFA" />
      <text x="365" y="61" class="lang-text">Dart 92%</text>
      <circle cx="355" cy="77" r="3" fill="#38BDF8" />
      <text x="365" y="81" class="lang-text">C++ 5%</text>
      <circle cx="355" cy="97" r="3" fill="#10B981" />
      <text x="365" y="101" class="lang-text">CMake 3%</text>

      <g transform="translate(500, 80)">
        <circle cx="0" cy="0" r="30" class="circle-bg" />
        <circle cx="0" cy="0" r="30" fill="none" stroke="#A78BFA" stroke-width="8" stroke-dasharray="173.4 188.5" stroke-dashoffset="0" transform="rotate(-90)" />
        <circle cx="0" cy="0" r="30" fill="none" stroke="#38BDF8" stroke-width="8" stroke-dasharray="9.4 188.5" stroke-dashoffset="-173.4" transform="rotate(-90)" />
        <circle cx="0" cy="0" r="30" fill="none" stroke="#10B981" stroke-width="8" stroke-dasharray="5.7 188.5" stroke-dashoffset="-182.8" transform="rotate(-90)" />
        <text x="0" y="4" class="circle-text">92%</text>
      </g>
    </g>
  </a>

  <!-- Card 2: SIGHT -->
  <a href="https://github.com/syans-OG/SIGHT" target="_blank" class="card">
    <g transform="translate(600, 60)">
      <rect width="560" height="150" class="card-bg" />
      <circle cx="20" cy="20" r="3" fill="#A78BFA" />
      <text x="28" y="24" class="repo-name">syans-OG/SIGHT</text>
      <circle cx="540" cy="20" r="3" fill="#334155" />

      <rect x="20" y="42" width="40" height="40" fill="#F59E0B" rx="8" />
      <text x="40" y="68" font-family="monospace" font-size="22" fill="#0A101F" text-anchor="middle" font-weight="bold">S</text>

      <text x="75" y="57" class="project-name">SIGHT_</text>
      <text x="75" y="75" class="desc">Vision &amp; image recognition system</text>

      <rect x="20" y="95" width="86" height="20" class="badge" />
      <text x="63" y="109" class="badge-text" text-anchor="middle">JavaScript</text>
      <rect x="114" y="95" width="40" height="20" class="badge" />
      <text x="134" y="109" class="badge-text" text-anchor="middle">CSS</text>
      <rect x="162" y="95" width="46" height="20" class="badge" />
      <text x="185" y="109" class="badge-text" text-anchor="middle">HTML</text>

      <text x="20" y="135" class="stat">★ 1   updated recently</text>

      <circle cx="355" cy="57" r="3" fill="#F59E0B" />
      <text x="365" y="61" class="lang-text">JS 40%</text>
      <circle cx="355" cy="77" r="3" fill="#A78BFA" />
      <text x="365" y="81" class="lang-text">CSS 34%</text>
      <circle cx="355" cy="97" r="3" fill="#E11D48" />
      <text x="365" y="101" class="lang-text">HTML 26%</text>

      <g transform="translate(500, 80)">
        <circle cx="0" cy="0" r="30" class="circle-bg" />
        <circle cx="0" cy="0" r="30" fill="none" stroke="#F59E0B" stroke-width="8" stroke-dasharray="75.4 188.5" stroke-dashoffset="0" transform="rotate(-90)" />
        <circle cx="0" cy="0" r="30" fill="none" stroke="#A78BFA" stroke-width="8" stroke-dasharray="64.1 188.5" stroke-dashoffset="-75.4" transform="rotate(-90)" />
        <circle cx="0" cy="0" r="30" fill="none" stroke="#E11D48" stroke-width="8" stroke-dasharray="49.0 188.5" stroke-dashoffset="-139.5" transform="rotate(-90)" />
        <text x="0" y="4" class="circle-text">40%</text>
      </g>
