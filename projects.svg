<svg width="1180" height="290" viewBox="0 0 1180 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots-projects" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#94a3b8" opacity="0.25" />
    </pattern>
  </defs>

  <style>
    :root { color-scheme: light dark; }

    /* Light Mode (default) */
    .bg { fill: #f8fafc; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; transition: stroke 0.3s ease; }
    .title { font-family: system-ui, -apple-system, sans-serif; fill: #0f172a; font-weight: 800; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; fill: #64748b; font-weight: 700; }
    .project-title { font-family: system-ui, -apple-system, sans-serif; fill: #0f172a; font-weight: 700; }
    .project-desc { font-family: system-ui, -apple-system, sans-serif; fill: #64748b; font-weight: 500; }
    .pill { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
    .pill-text { fill: #0f172a; font-family: system-ui, sans-serif; font-weight: 600; }
    .icon-box { fill: #0f172a; }
    .icon-text { fill: #ffffff; font-family: system-ui, sans-serif; font-weight: 800; }
    .dot-accent { fill: #0f172a; }
    .arrow-icon { stroke: #0f172a; }

    /* Dark Mode (GitHub Seamless Integration #0d1117) */
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #010101; stroke: #30363d; }
      .title { fill: #f8fafc; }
      .subtitle { fill: #8b949e; }
      .project-title { fill: #f8fafc; }
      .project-desc { fill: #8b949e; }
      .pill { fill: #161b22; stroke: #30363d; }
      .pill-text { fill: #f8fafc; }
      .icon-box { fill: #f8fafc; }
      .icon-text { fill: #0d1117; }
      .dot-accent { fill: #f8fafc; }
      .arrow-icon { stroke: #f8fafc; }
    }

    .card-group:hover .card { stroke: #8b949e; }
    .card-group:hover .arrow-g { transform: translateX(6px); }
    .arrow-g { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  </style>

  <!-- Canvas Background -->
  <rect width="1180" height="290" class="bg" />
  <rect width="1180" height="290" fill="url(#dots-projects)" />

  <!-- Section Header -->
  <circle cx="46" cy="30" r="4" class="dot-accent" />
  <text x="60" y="34" class="subtitle" font-size="12" letter-spacing="3">02 — SELECTED WORKS</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- PROJECT 1: Laris.in                        -->
  <!-- ═══════════════════════════════════════════ -->
  <a href="https://github.com/syans-OG/Laris.in" target="_blank" class="card-group">
    <g transform="translate(40, 55)">
      <rect width="535" height="195" rx="24" class="card" />

      <!-- App Icon Box -->
      <rect x="30" y="30" width="44" height="44" rx="12" class="icon-box" />
      <text x="52" y="58" class="icon-text" font-size="20" text-anchor="middle">L</text>

      <!-- Titles -->
      <text x="88" y="48" class="project-title" font-size="22">Laris.in</text>
      <text x="88" y="68" class="subtitle" font-size="12" opacity="0.7">POS Cashier Solution</text>

      <!-- Description -->
      <text x="30" y="112" class="project-desc" font-size="14">A seamless POS System app tailored for modern cashiers.</text>

      <!-- Badges -->
      <g transform="translate(30, 138)">
        <rect x="0" y="0" width="75" height="28" rx="14" class="pill" />
        <text x="37.5" y="18" class="pill-text" font-size="11" text-anchor="middle">Flutter</text>

        <rect x="85" y="0" width="60" height="28" rx="14" class="pill" />
        <text x="115" y="18" class="pill-text" font-size="11" text-anchor="middle">Dart</text>

        <rect x="155" y="0" width="65" height="28" rx="14" class="pill" />
        <text x="187.5" y="18" class="pill-text" font-size="11" text-anchor="middle">SQLite</text>
      </g>

      <!-- Arrow -->
      <g class="arrow-g" transform="translate(480, 40)">
        <line x1="0" y1="0" x2="16" y2="0" class="arrow-icon" stroke-width="2" stroke-linecap="round" />
        <line x1="10" y1="-6" x2="16" y2="0" class="arrow-icon" stroke-width="2" stroke-linecap="round" />
        <line x1="10" y1="6" x2="16" y2="0" class="arrow-icon" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>
  </a>

  <!-- ═══════════════════════════════════════════ -->
  <!-- PROJECT 2: SIGHT                           -->
  <!-- ═══════════════════════════════════════════ -->
  <a href="https://github.com/syans-OG/SIGHT" target="_blank" class="card-group">
    <g transform="translate(605, 55)">
      <rect width="535" height="195" rx="24" class="card" />

      <!-- App Icon Box -->
      <rect x="30" y="30" width="44" height="44" rx="12" class="icon-box" />
      <text x="52" y="58" class="icon-text" font-size="20" text-anchor="middle">S</text>

      <!-- Titles -->
      <text x="88" y="48" class="project-title" font-size="22">SIGHT</text>
      <text x="88" y="68" class="subtitle" font-size="12" opacity="0.7">Vision Assistance AI</text>

      <!-- Description -->
      <text x="30" y="112" class="project-desc" font-size="14">Vision assistance and intelligent image recognition system.</text>

      <!-- Badges -->
      <g transform="translate(30, 138)">
        <rect x="0" y="0" width="75" height="28" rx="14" class="pill" />
        <text x="37.5" y="18" class="pill-text" font-size="11" text-anchor="middle">Flutter</text>

        <rect x="85" y="0" width="60" height="28" rx="14" class="pill" />
        <text x="115" y="18" class="pill-text" font-size="11" text-anchor="middle">Dart</text>

        <rect x="155" y="0" width="60" height="28" rx="14" class="pill" />
        <text x="185" y="18" class="pill-text" font-size="11" text-anchor="middle">AI/ML</text>
      </g>

      <!-- Arrow -->
      <g class="arrow-g" transform="translate(480, 40)">
        <line x1="0" y1="0" x2="16" y2="0" class="arrow-icon" stroke-width="2" stroke-linecap="round" />
        <line x1="10" y1="-6" x2="16" y2="0" class="arrow-icon" stroke-width="2" stroke-linecap="round" />
        <line x1="10" y1="6" x2="16" y2="0" class="arrow-icon" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>
  </a>
</svg>