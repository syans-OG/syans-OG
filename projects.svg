<svg width="1180" height="230" viewBox="0 0 1180 230" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: monospace; font-size: 14px; font-weight: bold; fill: #38BDF8; }
    .cmd { font-family: monospace; font-size: 14px; fill: #475569; }
    .card-bg { fill: #0B1120; stroke: #1E293B; stroke-width: 1.5; rx: 10; }
    .repo-name { font-family: monospace; font-size: 11px; fill: #64748B; }
    .project-name { font-family: monospace; font-size: 18px; font-weight: bold; fill: #F8FAFC; }
    .desc { font-family: monospace; font-size: 12px; fill: #94A3B8; }
    .badge { fill: #1E1B4B; stroke: #312E81; stroke-width: 1; rx: 10; }
    .badge-text { font-family: monospace; font-size: 11px; fill: #A78BFA; }
    .stat { font-family: monospace; font-size: 11px; fill: #64748B; }
    .circle-bg { fill: none; stroke: #1E293B; stroke-width: 8; }
    .circle-text { font-family: monospace; font-size: 13px; font-weight: bold; fill: #F8FAFC; text-anchor: middle; dominant-baseline: middle; }
    .lang-text { font-family: monospace; font-size: 11px; fill: #94A3B8; }
    
    /* Hover effects for SVG */
    .card:hover .card-bg { stroke: #38BDF8; cursor: pointer; }
  </style>

  <text x="20" y="30" class="title">PROJECTS.LIST</text>
  <text x="150" y="30" class="cmd">./projects.sh --all</text>

  <!-- Card 1: Laris.in -->
  <a href="https://github.com/syans-OG/Laris.in" target="_blank" class="card">
    <g transform="translate(20, 60)">
      <rect width="560" height="150" class="card-bg" />
      
      <!-- Header -->
      <circle cx="20" cy="20" r="3" fill="#38BDF8" />
      <text x="28" y="24" class="repo-name">syans-OG/Laris.in</text>
      <circle cx="540" cy="20" r="3" fill="#334155" />
      
      <!-- Icon/Avatar placeholder -->
      <rect x="20" y="45" width="45" height="45" fill="#10B981" rx="8" />
      <text x="42.5" y="73" font-family="monospace" font-size="24" fill="#0A101F" text-anchor="middle" font-weight="bold">L</text>
      
      <!-- Texts -->
      <text x="80" y="58" class="project-name">Laris.in_</text>
      <text x="80" y="78" class="desc">A seamless POS System app tailored for modern cashiers</text>
      
      <!-- Badges -->
      <rect x="80" y="100" width="64" height="20" class="badge" />
      <text x="112" y="114" class="badge-text" text-anchor="middle">Flutter</text>
      
      <rect x="152" y="100" width="46" height="20" class="badge" />
      <text x="175" y="114" class="badge-text" text-anchor="middle">Dart</text>

      <rect x="206" y="100" width="60" height="20" class="badge" />
      <text x="236" y="114" class="badge-text" text-anchor="middle">SQLite</text>

      <!-- Stat -->
      <text x="80" y="138" class="stat">★ 3   updated recently</text>

      <!-- Language List -->
      <circle cx="370" cy="70" r="3" fill="#A78BFA" />
      <text x="380" y="74" class="lang-text">Dart 80%</text>

      <circle cx="370" cy="90" r="3" fill="#38BDF8" />
      <text x="380" y="94" class="lang-text">C++ 15%</text>

      <circle cx="370" cy="110" r="3" fill="#10B981" />
      <text x="380" y="114" class="lang-text">Swift 5%</text>

      <!-- Progress Circle (Donut) -->
      <g transform="translate(485, 90)">
        <circle cx="0" cy="0" r="30" class="circle-bg" />
        
        <!-- Dart 80% (150.8) -->
        <circle cx="0" cy="0" r="30" fill="none" stroke="#A78BFA" stroke-width="8" 
                stroke-dasharray="150.8 188.5" stroke-dashoffset="0" transform="rotate(-90)" />
        <!-- C++ 15% (28.27) -->
        <circle cx="0" cy="0" r="30" fill="none" stroke="#38BDF8" stroke-width="8" 
                stroke-dasharray="28.27 188.5" stroke-dashoffset="-150.8" transform="rotate(-90)" />
        <!-- Swift 5% (9.42) -->
        <circle cx="0" cy="0" r="30" fill="none" stroke="#10B981" stroke-width="8" 
                stroke-dasharray="9.42 188.5" stroke-dashoffset="-179.07" transform="rotate(-90)" />

        <text x="0" y="4" class="circle-text">80%</text>
      </g>
    </g>
  </a>

  <!-- Card 2: SIGHT -->
  <a href="https://github.com/syans-OG/SIGHT" target="_blank" class="card">
    <g transform="translate(600, 60)">
      <rect width="560" height="150" class="card-bg" />
      
      <!-- Header -->
      <circle cx="20" cy="20" r="3" fill="#A78BFA" />
      <text x="28" y="24" class="repo-name">syans-OG/SIGHT</text>
      <circle cx="540" cy="20" r="3" fill="#334155" />
      
      <!-- Icon/Avatar placeholder -->
      <rect x="20" y="45" width="45" height="45" fill="#F59E0B" rx="8" />
      <text x="42.5" y="73" font-family="monospace" font-size="24" fill="#0A101F" text-anchor="middle" font-weight="bold">S</text>
      
      <!-- Texts -->
      <text x="80" y="58" class="project-name">SIGHT_</text>
      <text x="80" y="78" class="desc">Vision assistance and image recognition system</text>
      
      <!-- Badges -->
      <rect x="80" y="100" width="64" height="20" class="badge" />
      <text x="112" y="114" class="badge-text" text-anchor="middle">Flutter</text>
      
      <rect x="152" y="100" width="46" height="20" class="badge" />
      <text x="175" y="114" class="badge-text" text-anchor="middle">Dart</text>

      <rect x="206" y="100" width="60" height="20" class="badge" />
      <text x="236" y="114" class="badge-text" text-anchor="middle">Python</text>

      <!-- Stat -->
      <text x="80" y="138" class="stat">★ 1   updated recently</text>

      <!-- Language List -->
      <circle cx="370" cy="70" r="3" fill="#A78BFA" />
      <text x="380" y="74" class="lang-text">Dart 65%</text>

      <circle cx="370" cy="90" r="3" fill="#F59E0B" />
      <text x="380" y="94" class="lang-text">Python 25%</text>

      <circle cx="370" cy="110" r="3" fill="#38BDF8" />
      <text x="380" y="114" class="lang-text">C++ 10%</text>

      <!-- Progress Circle (Donut) -->
      <g transform="translate(485, 90)">
        <circle cx="0" cy="0" r="30" class="circle-bg" />
        
        <!-- Dart 65% (122.5) -->
        <circle cx="0" cy="0" r="30" fill="none" stroke="#A78BFA" stroke-width="8" 
                stroke-dasharray="122.5 188.5" stroke-dashoffset="0" transform="rotate(-90)" />
        <!-- Python 25% (47.1) -->
        <circle cx="0" cy="0" r="30" fill="none" stroke="#F59E0B" stroke-width="8" 
                stroke-dasharray="47.1 188.5" stroke-dashoffset="-122.5" transform="rotate(-90)" />
        <!-- C++ 10% (18.9) -->
        <circle cx="0" cy="0" r="30" fill="none" stroke="#38BDF8" stroke-width="8" 
                stroke-dasharray="18.9 188.5" stroke-dashoffset="-169.6" transform="rotate(-90)" />

        <text x="0" y="4" class="circle-text">65%</text>
      </g>
    </g>
  </a>
</svg>